<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gradient Glow</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #08090b;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .glow-stage {
    position: relative;
    width: 480px;
    height: 480px;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    mix-blend-mode: screen;
    will-change: transform;
  }

  /* halo exterior, rojo suave */
  .blob--outer {
    width: 420px;
    height: 420px;
    top: 30px;
    left: 30px;
    background: radial-gradient(circle at 50% 45%, rgba(255,90,60,0.55) 0%, rgba(220,30,40,0.35) 45%, rgba(220,30,40,0) 75%);
    animation: drift-a 9s ease-in-out infinite;
  }

  /* capa media, rojo-magenta */
  .blob--mid {
    width: 300px;
    height: 300px;
    top: 90px;
    left: 90px;
    background: radial-gradient(circle at 50% 50%, rgba(255,60,50,0.75) 0%, rgba(200,20,40,0.55) 55%, rgba(200,20,40,0) 75%);
    animation: drift-b 7s ease-in-out infinite;
  }

  /* nucleo, naranja intenso */
  .blob--core {
    width: 190px;
    height: 190px;
    top: 145px;
    left: 145px;
    background: radial-gradient(circle at 50% 50%, rgba(255,165,40,0.95) 0%, rgba(255,110,30,0.8) 55%, rgba(255,90,20,0) 78%);
    animation: drift-c 6s ease-in-out infinite;
  }

  @keyframes drift-a {
    0%   { transform: translate(0px, 0px) scale(1); }
    33%  { transform: translate(14px, -10px) scale(1.05); }
    66%  { transform: translate(-12px, 12px) scale(0.97); }
    100% { transform: translate(0px, 0px) scale(1); }
  }

  @keyframes drift-b {
    0%   { transform: translate(0px, 0px) scale(1); }
    50%  { transform: translate(-16px, -14px) scale(1.08); }
    100% { transform: translate(0px, 0px) scale(1); }
  }

  @keyframes drift-c {
    0%   { transform: translate(0px, 0px) scale(1); }
    25%  { transform: translate(8px, 10px) scale(1.06); }
    50%  { transform: translate(-6px, -8px) scale(0.95); }
    75%  { transform: translate(10px, -6px) scale(1.03); }
    100% { transform: translate(0px, 0px) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
  }
</style>
</head>
<body>

  <div class="glow-stage">
    <div class="blob blob--outer"></div>
    <div class="blob blob--mid"></div>
    <div class="blob blob--core"></div>
  </div>

</body>
</html>
